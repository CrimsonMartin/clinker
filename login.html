<!DOCTYPE html>
<html>
<head>
  <title>Citation Linker Login</title>
  <style>
    body {
      width: 350px;
      min-height: 600px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    .login-container {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      width: 100%;
      max-width: 300px;
    }
    
    .logo-section {
      text-align: center;
      margin-bottom: 24px;
    }
    
    .logo-section h1 {
      font-size: 24px;
      color: #1e293b;
      margin: 0 0 8px 0;
    }
    
    .logo-section p {
      color: #64748b;
      font-size: 14px;
      margin: 0;
    }
    
    .auth-tabs {
      display: flex;
      margin-bottom: 20px;
      border-bottom: 1px solid #e2e8f0;
    }
    
    .auth-tab {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      font-size: 14px;
      font-weight: 500;
      color: #64748b;
      cursor: pointer;
      position: relative;
      transition: color 0.2s ease;
    }
    
    .auth-tab:hover {
      color: #475569;
    }
    
    .auth-tab.active {
      color: #6366f1;
    }
    
    .auth-tab.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background: #6366f1;
    }
    
    .auth-form {
      display: none;
    }
    
    .auth-form.active {
      display: block;
    }
    
    .form-group {
      margin-bottom: 16px;
    }
    
    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #334155;
      margin-bottom: 6px;
    }
    
    .form-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }
    
    .form-input:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }
    
    .form-input.error {
      border-color: #ef4444;
    }
    
    .error-message {
      font-size: 12px;
      color: #ef4444;
      margin-top: 4px;
      display: none;
    }
    
    .error-message.show {
      display: block;
    }
    
    .submit-button {
      width: 100%;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 8px;
    }
    
    .submit-button:hover {
      background: #4f46e5;
      transform: translateY(-1px);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    
    .submit-button:active {
      transform: translateY(0);
    }
    
    .submit-button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      transform: none;
    }
    
    
    .continue-offline {
      text-align: center;
      margin-top: 20px;
    }
    
    .continue-offline-button {
      background: none;
      border: none;
      color: #6366f1;
      font-size: 14px;
      cursor: pointer;
      text-decoration: underline;
      transition: color 0.2s ease;
    }
    
    .continue-offline-button:hover {
      color: #4f46e5;
    }
    
    .forgot-password {
      text-align: right;
      margin-top: 8px;
    }
    
    .forgot-password-link {
      background: none;
      border: none;
      color: #6366f1;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    
    .forgot-password-link:hover {
      color: #4f46e5;
      text-decoration: underline;
    }
    
    .loading-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #ffffff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .success-message {
      background: #10b981;
      color: white;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      text-align: center;
      margin-bottom: 16px;
      display: none;
    }
    
    .success-message.show {
      display: block;
    }

    .account-view {
      display: none;
    }

    .account-view.active {
      display: block;
    }

    .account-email {
      font-size: 14px;
      color: #334155;
      text-align: center;
      margin-bottom: 16px;
      word-break: break-all;
    }

    .secondary-button {
      width: 100%;
      background: white;
      color: #334155;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
    }

    .secondary-button:hover {
      background: #f1f5f9;
    }

    .danger-zone {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
    }

    .danger-zone p {
      font-size: 12px;
      color: #64748b;
      margin: 0 0 8px 0;
    }

    .danger-button {
      width: 100%;
      background: white;
      color: #dc2626;
      border: 1px solid #fca5a5;
      border-radius: 6px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .danger-button:hover {
      background: #fef2f2;
    }

    .account-form {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #e2e8f0;
    }

    .account-form.active {
      display: block;
    }

    .danger-zone .form-group {
      margin-bottom: 8px;
    }

    .danger-button:disabled {
      color: #94a3b8;
      border-color: #e2e8f0;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo-section">
      <h1>Citation Linker</h1>
      <p>Sign in to sync your research across devices</p>
    </div>
    
    <div class="success-message" id="successMessage"></div>
    
    <!-- Account view (shown when signed in) -->
    <div class="account-view" id="accountView">
      <div class="account-email">Signed in as <strong id="accountEmail"></strong></div>
      <button type="button" class="submit-button" id="backToSidebarBtn">Back to Citation Linker</button>
      <button type="button" class="secondary-button" id="accountSignOutBtn">Sign Out</button>
      <button type="button" class="secondary-button" id="signOutEverywhereBtn" title="Sign out on every device and browser, including this one">Sign Out Everywhere</button>
      <button type="button" class="secondary-button" id="showChangePasswordBtn">Change Password</button>
      <div class="error-message" id="account-actions-error"></div>

      <!-- Change password (signs out every other session) -->
      <form class="account-form" id="changePasswordForm">
        <div class="form-group">
          <label class="form-label" for="change-current-password">Current password</label>
          <input type="password" id="change-current-password" class="form-input" placeholder="**********" autocomplete="current-password" required>
          <div class="error-message" id="change-current-password-error"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="change-new-password">New password</label>
          <input type="password" id="change-new-password" class="form-input" placeholder="**********" autocomplete="new-password" required>
          <div class="error-message" id="change-new-password-error"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="change-confirm-password">Confirm new password</label>
          <input type="password" id="change-confirm-password" class="form-input" placeholder="**********" autocomplete="new-password" required>
          <div class="error-message" id="change-confirm-password-error"></div>
        </div>
        <button type="submit" class="submit-button" id="changePasswordBtn">Update Password</button>
      </form>

      <div class="danger-zone">
        <p>Deleting your account permanently removes it and all research synced to the server. Data on this device is cleared as well.</p>
        <div class="form-group">
          <label class="form-label" for="delete-password">Password</label>
          <input type="password" id="delete-password" class="form-input" placeholder="Enter your password to confirm" autocomplete="current-password">
        </div>
        <button type="button" class="danger-button" id="deleteAccountBtn">Delete Account</button>
        <div class="error-message" id="account-error"></div>
      </div>
    </div>

    <div class="auth-tabs" id="authTabs">
      <button class="auth-tab active" data-tab="signin">Sign In</button>
      <button class="auth-tab" data-tab="signup">Sign Up</button>
    </div>
    
    <!-- Sign In Form -->
    <form class="auth-form active" id="signinForm">
      <div class="form-group">
        <label class="form-label" for="signin-email">Email</label>
        <input type="email" id="signin-email" class="form-input" placeholder="you@example.com" required>
        <div class="error-message" id="signin-email-error"></div>
      </div>
      
      <div class="form-group">
        <label class="form-label" for="signin-password">Password</label>
        <input type="password" id="signin-password" class="form-input" placeholder="**********" required>
        <div class="error-message" id="signin-password-error"></div>
      </div>
      
      <!-- Hidden unless the server can send reset mail (GET /v1/config) -->
      <div class="forgot-password" id="forgotPasswordLinks" hidden>
        <button type="button" class="forgot-password-link" id="forgotPasswordBtn">Forgot password?</button>
        <button type="button" class="forgot-password-link" id="haveResetCodeBtn">Have a reset code?</button>
      </div>
      
      <button type="submit" class="submit-button" id="signinBtn">
        Sign In
      </button>
    </form>
    
    <!-- Sign Up Form -->
    <form class="auth-form" id="signupForm">
      <div class="form-group">
        <label class="form-label" for="signup-email">Email</label>
        <input type="email" id="signup-email" class="form-input" placeholder="you@example.com" required>
        <div class="error-message" id="signup-email-error"></div>
      </div>
      
      <div class="form-group">
        <label class="form-label" for="signup-password">Password</label>
        <input type="password" id="signup-password" class="form-input" placeholder="**********" required>
        <div class="error-message" id="signup-password-error"></div>
      </div>
      
      <div class="form-group">
        <label class="form-label" for="signup-confirm-password">Confirm Password</label>
        <input type="password" id="signup-confirm-password" class="form-input" placeholder="**********" required>
        <div class="error-message" id="signup-confirm-password-error"></div>
      </div>
      
      <button type="submit" class="submit-button" id="signupBtn">
        Create Account
      </button>
    </form>
    
    <!-- Password reset form (code from the reset email) -->
    <form class="auth-form" id="resetForm">
      <div class="form-group">
        <label class="form-label" for="reset-token">Reset code</label>
        <input type="text" id="reset-token" class="form-input" placeholder="Code from the reset email" autocomplete="one-time-code" required>
        <div class="error-message" id="reset-token-error"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="reset-password">New password</label>
        <input type="password" id="reset-password" class="form-input" placeholder="**********" required>
        <div class="error-message" id="reset-password-error"></div>
      </div>

      <button type="submit" class="submit-button" id="resetBtn">
        Set New Password
      </button>
    </form>

    <div class="continue-offline" id="continueOffline">
      <button class="continue-offline-button" id="continueOfflineBtn">Continue without signing in</button>
    </div>
  </div>
  
  <!-- Browser compatibility layer - MUST be loaded first -->
  <script src="dist/browser-compat.js"></script>
  
  <!-- Sync API configuration (generated by build-config.js) -->
  <script src="api/config.js"></script>
  
  <!-- Extension scripts -->
  <script defer src="api/auth.js"></script>
  <script defer src="login.js"></script>
</body>
</html>
