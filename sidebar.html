<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Citation Linker</title>

  <!-- Modular CSS Files -->
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/controls.css">
  <link rel="stylesheet" href="styles/tabs.css">
  <link rel="stylesheet" href="styles/tree-nodes.css">
  <link rel="stylesheet" href="styles/annotations.css">
  <link rel="stylesheet" href="styles/modals.css">
  <link rel="stylesheet" href="styles/auth.css">
  <link rel="stylesheet" href="styles/search.css">
  <link rel="stylesheet" href="styles/donation.css">
  <link rel="stylesheet" href="styles/export.css">
</head>
<body>
  <!-- Icons: lucide-static v0.515.0 (ISC license), inlined as a sprite. Use: <svg class="icon"><use href="#i-NAME"/></svg> -->

    <symbol id="i-chevron-up" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6" /></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14" /> <path d="M12 5v14" /></symbol>
    <symbol id="i-trash-2" viewBox="0 0 24 24"><path d="M3 6h18" /> <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /> <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /> <line x1="10" x2="10" y1="11" y2="17" /> <line x1="14" x2="14" y1="11" y2="17" /></symbol>
    <symbol id="i-message-square-plus" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" /> <path d="M12 7v6" /> <path d="M9 10h6" /></symbol>
    <symbol id="i-message-square-text" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" /> <path d="M13 8H7" /> <path d="M17 12H7" /></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" /> <path d="M19 10v2a7 7 0 0 1-14 0v-2" /> <line x1="12" x2="12" y1="19" y2="22" /></symbol>
    <symbol id="i-square" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2" /></symbol>
    <symbol id="i-log-out" viewBox="0 0 24 24"><path d="m16 17 5-5-5-5" /> <path d="M21 12H9" /> <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /></symbol>
    <symbol id="i-log-in" viewBox="0 0 24 24"><path d="m10 17 5-5-5-5" /> <path d="M15 12H3" /> <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" /></symbol>
    <symbol id="i-coffee" viewBox="0 0 24 24"><path d="M10 2v2" /> <path d="M14 2v2" /> <path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1" /> <path d="M6 2v2" /></symbol>
    <symbol id="i-refresh-cw" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /> <path d="M21 3v5h-5" /> <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /> <path d="M8 16H3v5" /></symbol>
    <symbol id="i-file-down" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" /> <path d="M14 2v4a2 2 0 0 0 2 2h4" /> <path d="M12 18v-6" /> <path d="m9 15 3 3 3-3" /></symbol>
    <symbol id="i-quote" viewBox="0 0 24 24"><path d="M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z" /> <path d="M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z" /></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" /> <path d="m15 5 4 4" /></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2" /> <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" /></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 15V3" /> <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /> <path d="m7 10 5 5 5-5" /></symbol>
  </svg>

  <header class="app-header">
    <div class="brand">
      <img class="brand-logo" src="icons/icon48.png" alt="" width="20" height="20">
      <h1>Citation Linker</h1>
    </div>
    <div class="header-actions">
      <button type="button" class="icon-button export-btn" id="exportBtn" title="Export references (APA, MLA, BibTeX, RIS…)" aria-label="Export references">
        <svg class="icon" aria-hidden="true"><use href="#i-file-down"/></svg>
      </button>
      <button type="button" class="icon-button search-toggle-btn" id="searchToggleBtn" title="Search citations (Ctrl+F)" aria-label="Search citations" aria-controls="searchContainer">
        <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
      </button>
      <label class="toggle" title="Turn citation capture on or off">
        <span class="toggle-switch">
          <input type="checkbox" id="extensionToggle" checked aria-label="Capture citations">
          <span class="toggle-slider"></span>
        </span>
        <span class="toggle-status active" id="toggleStatus">ON</span>
      </label>
    </div>
  </header>

  <!-- Login prompt (shown by auth code when signed out) -->
  <div class="login-prompt" id="loginPrompt">
    <span class="login-prompt-text">Sign in to sync your research across devices</span>
    <button type="button" class="button button-primary login-button" id="loginButton">
      <svg class="icon" aria-hidden="true"><use href="#i-log-in"/></svg>
      Sign in
    </button>
  </div>

  <!-- Search bar (toggled by the search button) -->
  <div class="search-container" id="searchContainer" role="search" style="display: none;">
    <div class="search-input-wrapper">
      <svg class="icon search-input-icon" aria-hidden="true"><use href="#i-search"/></svg>
      <input type="search" id="searchInput" class="search-input" placeholder="Search citations and annotations" aria-label="Search citations and annotations" autocomplete="off" />
      <span id="searchCounter" class="search-counter" aria-live="polite">0 of 0</span>
      <button type="button" id="searchPrevBtn" class="icon-button search-nav-btn" title="Previous result (Shift+Enter)" aria-label="Previous result" disabled>
        <svg class="icon" aria-hidden="true"><use href="#i-chevron-up"/></svg>
      </button>
      <button type="button" id="searchNextBtn" class="icon-button search-nav-btn" title="Next result (Enter)" aria-label="Next result" disabled>
        <svg class="icon" aria-hidden="true"><use href="#i-chevron-down"/></svg>
      </button>
    </div>
  </div>

  <!-- Tab bar (rendered by components/tabBar.ts) -->
  <nav id="tab-bar-container" aria-label="Research tabs"></nav>

  <!-- Research tree (rendered by components/treeContainer.ts) -->
  <main class="tree-container">
    <div id="tree-root" aria-label="Research tree">
      <div class="empty-state">Loading…</div>
    </div>
    <div class="tree-hint" aria-hidden="true">Drag to reorder or nest · double-click to open · right-click for more</div>
  </main>

  <footer class="app-footer">
    <!-- User section (shown by auth code when signed in) -->
    <div class="user-section" id="userSection">
      <div class="sync-status" id="syncStatus" title="Sync status">
        <svg class="icon sync-icon offline" id="syncIcon" aria-hidden="true"><use href="#i-refresh-cw"/></svg>
        <span id="syncStatusText">Offline</span>
      </div>
      <div class="user-info">
        <span class="user-email" id="userEmail"></span>
        <button type="button" class="icon-button logout-button" id="logoutButton" title="Sign out" aria-label="Sign out">
          <svg class="icon" aria-hidden="true"><use href="#i-log-out"/></svg>
        </button>
      </div>
    </div>

    <!-- Buy Me a Coffee -->
    <button type="button" class="button button-ghost donation-button" id="donationButton" title="Support development: buy me a coffee">
      <svg class="icon" aria-hidden="true"><use href="#i-coffee"/></svg>
      Support
    </button>
  </footer>

  <!-- Browser compatibility layer - MUST be loaded first -->
  <script src="dist/browser-compat.js"></script>
  
  <!-- Sync API configuration (generated by build-config.js) -->
  <script src="api/config.js"></script>
  
  <!-- Extension scripts -->
  <script defer src="api/auth.js"></script>
  <script defer src="api/sync.js"></script>
  
  <!-- Utility scripts -->
  <script defer src="dist/utils/formatters.js"></script>
  
  <!-- Service layer -->
  <script defer src="dist/services/tabService.js"></script>
  <script defer src="dist/services/treeService.js"></script>
  <script defer src="dist/services/treeValidationService.js"></script>
  <script defer src="dist/services/searchService.js"></script>
  <script defer src="dist/citationMetadata.js"></script>
  <script defer src="dist/services/citationService.js"></script>
  <script defer src="dist/services/citationApi.js"></script>
  
  <!-- UI Components -->
  <script defer src="deleteButton.js"></script>
  <script defer src="speechRecognition.js"></script>
  <script defer src="annotationButton.js"></script>
  
  <!-- Component layer -->
  <script defer src="dist/components/treeNode.js"></script>
  <script defer src="dist/components/treeContainer.js"></script>
  <script defer src="dist/components/searchBar.js"></script>
  <script defer src="dist/components/tabBar.js"></script>
  <script defer src="dist/components/authStatus.js"></script>
  <script defer src="dist/components/exportDialog.js"></script>
  <script defer src="dist/components/citationEditor.js"></script>
  <script defer src="dist/components/sidebarController.js"></script>
  
  <!-- Legacy sidebar.js - to be removed after full migration -->
  <script defer src="sidebar.js"></script>
</body>
</html>
