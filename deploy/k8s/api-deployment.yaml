apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinker-api
  labels:
    app.kubernetes.io/name: clinker-api
    app.kubernetes.io/component: api
spec:
  replicas: 1 # single-node cluster; auth rate limit is per-pod in-memory
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: clinker-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clinker-api
        app.kubernetes.io/component: api
    spec:
      # GHCR pull secret (copied from the jobsearch namespace's `regcred`).
      imagePullSecrets:
        - name: regcred
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/crimsonmartin/clinker-api # tag set by kustomization.yaml `images:`
          imagePullPolicy: IfNotPresent # tags are immutable sha-<commit>
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: clinker-api-config
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: clinker-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: clinker-secrets
                  key: JWT_SECRET
            - name: SMTP_URL
              valueFrom:
                secretKeyRef:
                  name: clinker-secrets
                  key: SMTP_URL
                  optional: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            # Allows up to ~90s for the DB to become reachable and migrations to run.
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 30
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
