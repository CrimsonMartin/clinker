apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clinker-api
  labels:
    app.kubernetes.io/name: clinker-api
  annotations:
    # Matches the other apps on the Hetzner k3s box (jobs.lanerate.io, app.lanerate.io):
    # ingress-nginx + cert-manager ClusterIssuer `letsencrypt-prod` (HTTP-01 via nginx).
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 6m
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - clinker.lanerate.io
      secretName: clinker-lanerate-tls
  rules:
    - host: clinker.lanerate.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: clinker-api
                port:
                  name: http
