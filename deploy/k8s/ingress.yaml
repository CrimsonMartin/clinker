apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clinker-api
  labels:
    app.kubernetes.io/name: clinker-api
  annotations:
    # Matches the other apps on the Hetzner k3s box (jobs.lanerate.io, app.lanerate.io):
    # ingress-nginx + cert-manager ClusterIssuer `letsencrypt-prod` (HTTP-01 via nginx).
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 6m
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    # Only Cloudflare may reach the origin: direct hits to the node IP get 403, so the app's
    # per-client rate limits (keyed on CF-Connecting-IP) can't be bypassed. ingress-nginx runs
    # with hostNetwork and no forwarded-header trust, so this checks the real TCP peer.
    # Source: https://www.cloudflare.com/ips-v4 and /ips-v6 (fetched 2026-11-08; they change rarely).
    # The cert-manager HTTP-01 solver uses its own Ingress, so renewals are unaffected.
    nginx.ingress.kubernetes.io/whitelist-source-range: >-
      173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - clinker.lanerate.io
      secretName: clinker-lanerate-tls
  rules:
    - host: clinker.lanerate.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: clinker-api
                port:
                  name: http
