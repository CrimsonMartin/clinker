# EXAMPLE ONLY. Not referenced by kustomization.yaml; do not commit a filled-in copy.
#
# Create the real secret with (recommended, keeps values out of files):
#
#   PGPW=$(openssl rand -hex 24)
#   kubectl -n clinker create secret generic clinker-secrets \
#     --from-literal=POSTGRES_PASSWORD="$PGPW" \
#     --from-literal=DATABASE_URL="postgres://clinker:${PGPW}@postgres.clinker.svc.cluster.local:5432/clinker" \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)"
#     # optionally: --from-literal=SMTP_URL='smtps://user:pass@smtp.example.com:465'
#
# Or copy this file, fill it in, `kubectl apply -f` it, and delete the copy.
apiVersion: v1
kind: Secret
metadata:
  name: clinker-secrets
  namespace: clinker
type: Opaque
stringData:
  # Password for the in-cluster Postgres (postgres/ component). Used only on FIRST init of the
  # data volume; changing it later requires ALTER USER inside Postgres too.
  # Use hex/alphanumeric so it needs no URL-encoding in DATABASE_URL.
  POSTGRES_PASSWORD: "change-me-hex-password"

  # Connection string the API uses. With the bundled Postgres component:
  #   postgres://clinker:<POSTGRES_PASSWORD>@postgres.clinker.svc.cluster.local:5432/clinker
  # With an external Postgres, point it there (append ?sslmode=require if needed).
  DATABASE_URL: "postgres://clinker:change-me-hex-password@postgres.clinker.svc.cluster.local:5432/clinker"

  # HS256 signing key for access tokens, >= 32 bytes. `openssl rand -base64 48`.
  # Rotating it logs out nobody permanently: access tokens expire in 15 min and refresh
  # tokens are opaque DB values, so clients just refresh.
  JWT_SECRET: "replace-with-output-of-openssl-rand-base64-48"

  # OPTIONAL. Omit the key entirely to disable password-reset mail (the endpoint still returns 202).
  # nodemailer URL format, e.g. smtps://user:pass@smtp.example.com:465 or smtp://user:pass@host:587
  SMTP_URL: "smtps://user:password@smtp.example.com:465"
