# Optional component: single-replica Postgres with a 5Gi PVC on the default StorageClass.
# Omit it (remove from `components:` in ../kustomization.yaml) to use an existing Postgres.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - statefulset.yaml
  - service.yaml
  - networkpolicy.yaml
