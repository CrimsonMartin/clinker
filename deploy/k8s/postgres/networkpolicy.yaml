# Only the API pods may connect to Postgres. (Enforced on k3s by its built-in network
# policy controller; ignored harmlessly on CNIs without NetworkPolicy support.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: clinker-api
      ports:
        - protocol: TCP
          port: 5432
